name: Notion → Discord task notifications

on:
  schedule:
    # Mỗi 5 phút, lệch 3 phút khỏi mốc :00/:05 để tránh giờ cao điểm của GitHub
    # (GitHub có thể trễ hoặc bỏ lượt chạy theo lịch khi tải cao).
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {} # chạy tay: tab Actions → Run workflow

concurrency:
  group: notion-discord
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Send new Notion tasks to Discord
        run: node .github/scripts/notion-to-discord.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTIONS: ${{ secrets.DISCORD_MENTIONS }}

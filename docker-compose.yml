# Local PostgreSQL for development and tests only. Staging uses Supabase (ADR-004).
services:
  db:
    image: postgres:17-alpine
    container_name: unievent-db
    environment:
      POSTGRES_USER: unievent
      POSTGRES_PASSWORD: unievent
      POSTGRES_DB: unievent_dev
    ports:
      - "5432:5432"
    volumes:
      - unievent-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unievent -d unievent_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  unievent-db:
